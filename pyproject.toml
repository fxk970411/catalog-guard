[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catalog-guard-local"
version = "0.1.0"
description = "Offline quality gates for small CSV and JSON public catalogs"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
catalog-guard = "catalog_guard.cli:main"

[tool.setuptools.packages.find]
include = ["catalog_guard*"]
